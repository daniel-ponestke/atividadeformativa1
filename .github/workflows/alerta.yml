name: Alerta Discord

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  alerta:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar alerta para o Discord
        uses: Ilshidur/action-discord@0.3.2
        with:
          args: '🔔 Alerta do repositório ${{ github.repository }} | Evento: ${{ github.event_name }} | Branch: ${{ github.ref_name }} | Autor: ${{ github.actor }}'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}