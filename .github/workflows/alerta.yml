name: Alerta Discord

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  alerta:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar alerta para o Discord
        run: |
          curl -H "Content-Type: application/json" \
            -d '{"content": "🔔 Alerta do repositório ${{ github.repository }} (evento: ${{ github.event_name }}, branch: ${{ github.ref_name }}, autor: ${{ github.actor }})"}' \
            ${{ secrets.DISCORD_WEBHOOK }}